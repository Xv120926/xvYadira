<div class="swiper">
  <div class="swiper-wrapper">
    <!-- Seccion se gift -->
    <div class="swiper-slide">
       <app-portada></app-portada>
    </div>
    <!-- foto con contador -->
    <div class="swiper-slide">
      <div class="seccion-con-fondo"></div>
      <div id="contador" class="contador">
      <div class="caja">
        <span id="dias">0</span>
        <p>Días</p>
      </div>
      <div class="caja">
        <span id="horas">0</span>
        <p>Horas</p>
      </div>
      <div class="caja">
        <span id="minutos">0</span>
        <p>Minutos</p>
      </div>
      <div class="caja">
        <span id="segundos">0</span>
        <p>Segundos</p>
      </div>
    </div>
    <!-- Seccion fondo con Mariposas -->
    </div>
    <div class="swiper-slide">
      <div class="seccion-con-fondo-mariposa"></div>
    </div>
    <div class="swiper-slide">Confirmación</div>
  </div>
  <div class="swiper-pagination"></div>
</div>



<script>
  // Fecha del evento (ejemplo: 8 agosto 2026 a las 20:00)
  const fechaEvento = new Date("2026-09-12T14:00:00").getTime();

  function actualizarContador() {
    const ahora = new Date().getTime();
    const diferencia = fechaEvento - ahora;

    if (diferencia <= 0) {
      document.getElementById("contador").innerHTML = "¡El evento ha comenzado!";
      return;
    }

    const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
    const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

    document.getElementById("dias").textContent = dias;
    document.getElementById("horas").textContent = horas;
    document.getElementById("minutos").textContent = minutos;
    document.getElementById("segundos").textContent = segundos;
  }

  setInterval(actualizarContador, 1000);
</script>
